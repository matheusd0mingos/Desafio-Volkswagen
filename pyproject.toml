[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validacao"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
painel = ["streamlit>=1.46"]

[project.scripts]
validacao = "validacao.__main__:main"
validacao-painel = "validacao.adaptadores.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"validacao.adaptadores.sqlite" = ["*.sql"]
"validacao.adaptadores.web" = ["assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integracao: usa o arquivo Excel real"]
